[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bindofell"
version = "0.1.0"
description = "Versioned metadata contracts for reproducible semantic data binding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bm25s[indexing]==0.3.13",
    "pydantic>=2.11,<3",
]

[project.scripts]
bindofell = "bindofell.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyright[nodejs]>=1.1.400,<2"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
